services:
  - type: web
    name: glasscart
    runtime: docker
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - { key: APP_ENV, value: production }
      - { key: APP_URL, sync: false }
      - { key: APP_SECRET, generateValue: true }
      - { key: SUPABASE_URL, sync: false }
      - { key: SUPABASE_PUBLISHABLE_KEY, sync: false }
      - { key: SUPABASE_SECRET_KEY, sync: false }
      - { key: SUPABASE_STORAGE_BUCKET, value: product-images }
      - { key: SMTP_HOST, sync: false }
      - { key: SMTP_PORT, value: "587" }
      - { key: SMTP_SECURE, value: tls }
      - { key: SMTP_USER, sync: false }
      - { key: SMTP_PASS, sync: false }
      - { key: SMTP_FROM_EMAIL, sync: false }
      - { key: SMTP_FROM_NAME, value: "GlassCart" }
